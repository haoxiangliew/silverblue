name: Build image

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FEDORA_VERSION: "44"

jobs:
  resolve_amd64:
    name: Resolve AMD64 inputs
    runs-on: namespace-profile-silverblue-amd64-cached
    env:
      ARCHITECTURE: amd64
    permissions:
      contents: read
    outputs:
      brew_digest: ${{ steps.inputs.outputs.brew_digest }}
      fedora_digest: ${{ steps.inputs.outputs.fedora_digest }}
      transaction_fingerprint: ${{ steps.inputs.outputs.transaction_fingerprint }}
    steps:
      - name: Check out repository
        uses: namespacelabs/nscloud-checkout-action@v8

      - name: Resolve image inputs
        id: inputs
        run: bash .github/scripts/resolve-build-inputs.sh

  resolve_arm64:
    name: Resolve ARM64 inputs
    runs-on: namespace-profile-silverblue-arm64-cached
    env:
      ARCHITECTURE: arm64
    permissions:
      contents: read
    outputs:
      brew_digest: ${{ steps.inputs.outputs.brew_digest }}
      fedora_digest: ${{ steps.inputs.outputs.fedora_digest }}
      transaction_fingerprint: ${{ steps.inputs.outputs.transaction_fingerprint }}
    steps:
      - name: Check out repository
        uses: namespacelabs/nscloud-checkout-action@v8

      - name: Resolve image inputs
        id: inputs
        run: bash .github/scripts/resolve-build-inputs.sh

  resolve:
    name: Combine build inputs
    needs:
      - resolve_amd64
      - resolve_arm64
    runs-on: namespace-profile-silverblue-arm64-cached
    outputs:
      brew_digest: ${{ steps.inputs.outputs.brew_digest }}
      fedora_digest: ${{ steps.inputs.outputs.fedora_digest }}
      package_fingerprint: ${{ steps.inputs.outputs.package_fingerprint }}
    steps:
      - name: Combine image inputs
        id: inputs
        env:
          AMD64_BREW_DIGEST: ${{ needs.resolve_amd64.outputs.brew_digest }}
          AMD64_FEDORA_DIGEST: ${{ needs.resolve_amd64.outputs.fedora_digest }}
          AMD64_TRANSACTION: ${{ needs.resolve_amd64.outputs.transaction_fingerprint }}
          ARM64_BREW_DIGEST: ${{ needs.resolve_arm64.outputs.brew_digest }}
          ARM64_FEDORA_DIGEST: ${{ needs.resolve_arm64.outputs.fedora_digest }}
          ARM64_TRANSACTION: ${{ needs.resolve_arm64.outputs.transaction_fingerprint }}
        run: |
          [[ "${AMD64_FEDORA_DIGEST}" == "${ARM64_FEDORA_DIGEST}" ]]
          [[ "${AMD64_BREW_DIGEST}" == "${ARM64_BREW_DIGEST}" ]]
          package_fingerprint="$(
            printf 'amd64=%s\narm64=%s\n' \
              "${AMD64_TRANSACTION}" "${ARM64_TRANSACTION}" |
              sha256sum | cut -d ' ' -f 1
          )"
          {
            echo "brew_digest=${AMD64_BREW_DIGEST}"
            echo "fedora_digest=${AMD64_FEDORA_DIGEST}"
            echo "package_fingerprint=${package_fingerprint}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Combined build inputs"
            echo
            echo "- Fedora: \`${AMD64_FEDORA_DIGEST}\`"
            echo "- Homebrew: \`${AMD64_BREW_DIGEST}\`"
            echo "- DNF transaction: \`${package_fingerprint}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build ${{ matrix.variant }} image
    needs: resolve
    runs-on: namespace-profile-silverblue-arm64-cached
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            image_suffix: ""
            target: silverblue
            platforms: linux/amd64,linux/arm64
            description: Fedora Silverblue 44 with Nix, Homebrew, and multimedia support
          - variant: nvidia
            image_suffix: -nvidia
            target: nvidia
            platforms: linux/amd64
            description: Fedora Silverblue 44 with proprietary NVIDIA LTS drivers, Nix, Homebrew, and multimedia support
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.image_suffix }}
      PLATFORMS: ${{ matrix.platforms }}
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: Check out repository
        uses: namespacelabs/nscloud-checkout-action@v8

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4
        with:
          cosign-release: v3.1.2

      - name: Resolve NVIDIA input
        id: nvidia
        if: matrix.variant == 'nvidia'
        run: |
          manifest="$(docker buildx imagetools inspect --raw \
            "ghcr.io/ublue-os/akmods-nvidia-lts:main-${FEDORA_VERSION}")"
          digest="sha256:$(printf '%s' "${manifest}" | sha256sum | cut -d ' ' -f 1)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "### NVIDIA input"
            echo
            echo "- NVIDIA LTS artifact: \`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          pull: true
          push: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          provenance: mode=max
          sbom: true
          build-args: |
            FEDORA_VERSION=${{ env.FEDORA_VERSION }}
            FEDORA_IMAGE_DIGEST=${{ needs.resolve.outputs.fedora_digest }}
            BREW_IMAGE_DIGEST=${{ needs.resolve.outputs.brew_digest }}
            NVIDIA_AKMODS_DIGEST=${{ steps.nvidia.outputs.digest }}
            PACKAGE_FINGERPRINT=${{ needs.resolve.outputs.package_fingerprint }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.FEDORA_VERSION }}
            ${{ env.IMAGE }}:${{ env.FEDORA_VERSION }}-${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          annotations: |
            index,manifest,manifest-descriptor:org.opencontainers.image.description=${{ matrix.description }}

      - name: Attest published image
        id: attest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign published image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --recursive \
            --new-bundle-format=false \
            --registry-referrers-mode legacy \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE}@${DIGEST}"

      - name: Record published image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published ${VARIANT} image"
            echo
            echo "- Default channel: \`${IMAGE}:latest\`"
            echo "- Channel: \`${IMAGE}:${FEDORA_VERSION}\`"
            echo "- Build: \`${IMAGE}:${FEDORA_VERSION}-${GITHUB_RUN_ID}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Attestation: ${ATTESTATION_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
