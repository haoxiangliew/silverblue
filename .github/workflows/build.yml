name: Build image

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FEDORA_VERSION: "44"

jobs:
  resolve_amd64:
    name: Resolve AMD64 inputs
    runs-on: namespace-profile-silverblue-amd64-cached
    env:
      ARCHITECTURE: amd64
    permissions:
      contents: read
    outputs:
      brew_digest: ${{ steps.inputs.outputs.brew_digest }}
      fedora_digest: ${{ steps.inputs.outputs.fedora_digest }}
      transaction_fingerprint: ${{ steps.inputs.outputs.transaction_fingerprint }}
    steps:
      - name: Check out repository
        uses: namespacelabs/nscloud-checkout-action@v9

      - name: Configure DNF cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.cache/silverblue-dnf

      - name: Resolve image inputs
        id: inputs
        run: bash .github/scripts/resolve-build-inputs.sh

  resolve_arm64:
    name: Resolve ARM64 inputs
    runs-on: namespace-profile-silverblue-arm64-cached
    env:
      ARCHITECTURE: arm64
    permissions:
      contents: read
    outputs:
      brew_digest: ${{ steps.inputs.outputs.brew_digest }}
      fedora_digest: ${{ steps.inputs.outputs.fedora_digest }}
      transaction_fingerprint: ${{ steps.inputs.outputs.transaction_fingerprint }}
    steps:
      - name: Check out repository
        uses: namespacelabs/nscloud-checkout-action@v9

      - name: Configure DNF cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.cache/silverblue-dnf

      - name: Resolve image inputs
        id: inputs
        run: bash .github/scripts/resolve-build-inputs.sh

  build:
    name: Build ${{ matrix.variant }} image
    needs:
      - resolve_amd64
      - resolve_arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            runner: namespace-profile-silverblue-arm64-cached
            image_suffix: ""
            target: silverblue
            platforms: linux/amd64,linux/arm64
            description: Fedora Silverblue 44 with Nix, Homebrew, and multimedia support
          - variant: nvidia
            runner: namespace-profile-silverblue-amd64-cached
            image_suffix: -nvidia
            target: nvidia
            platforms: linux/amd64
            description: Fedora Silverblue 44 with proprietary NVIDIA LTS drivers, Nix, Homebrew, and multimedia support
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.image_suffix }}
      PLATFORMS: ${{ matrix.platforms }}
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: Check out repository
        uses: namespacelabs/nscloud-checkout-action@v9

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v2.6.4

      - name: Validate resolved inputs
        env:
          AMD64_BREW_DIGEST: ${{ needs.resolve_amd64.outputs.brew_digest }}
          AMD64_FEDORA_DIGEST: ${{ needs.resolve_amd64.outputs.fedora_digest }}
          ARM64_BREW_DIGEST: ${{ needs.resolve_arm64.outputs.brew_digest }}
          ARM64_FEDORA_DIGEST: ${{ needs.resolve_arm64.outputs.fedora_digest }}
        run: |
          [[ "${AMD64_FEDORA_DIGEST}" == "${ARM64_FEDORA_DIGEST}" ]]
          [[ "${AMD64_BREW_DIGEST}" == "${ARM64_BREW_DIGEST}" ]]

      - name: Resolve NVIDIA input
        id: nvidia
        if: matrix.variant == 'nvidia'
        run: |
          manifest="$(docker buildx imagetools inspect --raw \
            "ghcr.io/ublue-os/akmods-nvidia-lts:main-${FEDORA_VERSION}")"
          digest="sha256:$(printf '%s' "${manifest}" | sha256sum | cut -d ' ' -f 1)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "### NVIDIA input"
            echo
            echo "- NVIDIA LTS artifact: \`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          pull: true
          push: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          provenance: mode=max
          sbom: true
          build-args: |
            FEDORA_VERSION=${{ env.FEDORA_VERSION }}
            FEDORA_IMAGE_DIGEST=${{ needs.resolve_amd64.outputs.fedora_digest }}
            BREW_IMAGE_DIGEST=${{ needs.resolve_amd64.outputs.brew_digest }}
            NVIDIA_AKMODS_DIGEST=${{ steps.nvidia.outputs.digest }}
            PACKAGE_FINGERPRINT=${{ needs.resolve_amd64.outputs.transaction_fingerprint }}-${{ needs.resolve_arm64.outputs.transaction_fingerprint }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.FEDORA_VERSION }}
            ${{ env.IMAGE }}:${{ env.FEDORA_VERSION }}-${{ github.run_id }}
          # Source revisions live in provenance; volatile labels would create metadata-only upgrades.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          annotations: |
            index,manifest,manifest-descriptor:org.opencontainers.image.description=${{ matrix.description }}

      - name: Attest published image
        id: attest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign published image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # containers/image sigstoreSigned verification still discovers tag-based attachments.
          cosign sign --yes --recursive \
            --new-bundle-format=false \
            --registry-referrers-mode legacy \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE}@${DIGEST}"

      - name: Verify published image signature
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          repository="${IMAGE#ghcr.io/}"
          token="$(curl -fsSL \
            "https://ghcr.io/token?scope=repository:${repository}:pull" | jq -r .token)"
          index="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          mapfile -t subjects < <(
            jq -r '.manifests[] | select(.platform.os == "linux") | .digest' <<< "${index}"
          )
          subjects+=("${DIGEST}")
          for subject in "${subjects[@]}"; do
            signature="$(docker buildx imagetools inspect --raw \
              "${IMAGE}:sha256-${subject#sha256:}.sig")"
            layer="$(jq -ce '
              first(.layers[] | select(
                .mediaType == "application/vnd.dev.cosign.simplesigning.v1+json" and
                ((.annotations["dev.cosignproject.cosign/signature"] // "") | length > 0)
              ))
            ' <<< "${signature}")"
            payload_digest="$(jq -r .digest <<< "${layer}")"
            encoded_signature="$(
              jq -r '.annotations["dev.cosignproject.cosign/signature"]' <<< "${layer}"
            )"
            bundle="$(jq -er '.annotations["dev.sigstore.cosign/bundle"]' <<< "${layer}")"
            payload="$(curl -fsSL -H "Authorization: Bearer ${token}" \
              "https://ghcr.io/v2/${repository}/blobs/${payload_digest}")"
            jq -e --arg image "${IMAGE}" --arg subject "${subject}" '
              .critical.identity["docker-reference"] == $image and
              .critical.image["docker-manifest-digest"] == $subject and
              .critical.type == "cosign container image signature"
            ' <<< "${payload}" > /dev/null
            bundle_file="${RUNNER_TEMP}/cosign-bundle-${subject#sha256:}.json"
            printf '%s' "${bundle}" > "${bundle_file}"
            printf '%s' "${payload}" | cosign verify-blob \
              --bundle "${bundle_file}" \
              --key cosign.pub \
              --signature "${encoded_signature}" \
              - > /dev/null
            rm -f "${bundle_file}"
          done

      - name: Record published image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published ${VARIANT} image"
            echo
            echo "- Default channel: \`${IMAGE}:latest\`"
            echo "- Channel: \`${IMAGE}:${FEDORA_VERSION}\`"
            echo "- Build: \`${IMAGE}:${FEDORA_VERSION}-${GITHUB_RUN_ID}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Attestation: ${ATTESTATION_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
