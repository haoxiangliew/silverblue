name: Build image

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  FEDORA_VERSION: "44"

jobs:
  build:
    name: Build Silverblue image
    runs-on: namespace-profile-silverblue-arm64-cached
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out repository
        uses: namespacelabs/nscloud-checkout-action@v8

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache-filters: packages
          push: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          provenance: mode=max
          sbom: true
          build-args: |
            FEDORA_VERSION=${{ env.FEDORA_VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.FEDORA_VERSION }}
            ${{ env.IMAGE }}:${{ env.FEDORA_VERSION }}-${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Fedora Silverblue ${{ env.FEDORA_VERSION }} with Nix and Homebrew compatibility
            org.opencontainers.image.licenses=AGPL-3.0-only
          annotations: |
            index,manifest,manifest-descriptor:org.opencontainers.image.description=Fedora Silverblue ${{ env.FEDORA_VERSION }} with Nix and Homebrew compatibility

      - name: Attest published image
        id: attest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record published image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo "- Default channel: \`${IMAGE}:latest\`"
            echo "- Channel: \`${IMAGE}:${FEDORA_VERSION}\`"
            echo "- Build: \`${IMAGE}:${FEDORA_VERSION}-${GITHUB_RUN_ID}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Attestation: ${ATTESTATION_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
